- type: loadoutEffectGroup
  id: AquaintedCCO # You've been a member of CC for a good bit. A minor promotion with more trinkets to enjoy. Keep up the good work for more goodies.
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobCentralCommandOfficial
      time: 10h
- type: loadoutEffectGroup
  id: VeteranCCO # You've been a member of CC for a good while. We trust you to use our more expensive equipment responsibly.
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobCentralCommandOfficial
      time: 30h
- type: loadoutEffectGroup
  id: UltraVetCCO # By now, you've likely made a name for yourself in Central; you are granted equipment only trusted with the absolute best of the best. Make us proud.
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobCentralCommandOfficial
      time: 60h

