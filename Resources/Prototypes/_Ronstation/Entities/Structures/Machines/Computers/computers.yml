# Filled varients (Strange that SL defines it like this?)
- type: entity
  parent: ComputerCommsSalvage
  id: ComputerCommsSalvageFilled
  suffix: Filled, ShouldMapATS
  components:
    - type: ItemSlots
      slots:
        cell_slot:
          startingItem: PowerCellHigh
- type: entity
  parent: ComputerCommsITG
  id: ComputerCommsITGFilled
  categories: [ DoNotMap ]
  suffix: Filled, DO NOT MAP
  components:
    - type: ItemSlots
      slots:
        cell_slot:
          startingItem: PowerCellHigh
