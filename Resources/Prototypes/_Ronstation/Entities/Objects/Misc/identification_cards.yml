# The catch-all card that can be given to CCO, Division members, and other such loadouts so that there isn't need to make hundreds of new roles just to make the divisions 'work'.
- type: entity
  parent: [ AgentIDCard, BaseCentcommContraband ]
  id: CentcomIDCardDivision
  name: CentComm Division ID card
  suffix: Centcomm, Divisions
  description: An ID card restricted to members of Central Command's various divisions. If you have to ask if you're allowed, you likely aren't.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/id_cards.rsi
    layers:
    - state: centcom
    - sprite: &id-rsi Objects/Misc/id_cards.rsi
      state: stripe_top
      color: "#999999"
    - sprite: Objects/Misc/id_cards.rsi
      state: stripe_bottom
      color: "#6b6b6b"
    - sprite: &starlight-icon-rsi _Starlight/Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.09375, 0.0625 #3 pixels left, 2 pixels up
      state: CentComm
  - type: Clothing
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    sprite: Objects/Misc/id_cards.rsi
    heldPrefix: green
  - type: PresetIdCard
    job: CentralCommandOperator
  - type: ChameleonClothing
    slot: [idcard]
    default: CentcomIDCard
    requireTag: WhitelistChameleonIdCard
  - type: NanoChatCard
    listNumber: false

# CentCom Division Head cards, based off of the ERT Leader's ID card. Defined so that they can be chameleoned by the catchall card (or Agent IDs! Impersonation larp for MRP. Good luck faking heads though.)
- type: entity
  parent: IDCardStandard
  id: CCDAdminHeadIDCard
  name: CentComm Admin. Division Head ID
  description: An ID card for the prestigous Head of CC's Administration division.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/id_cards.rsi
    layers:
    - state: centcomgold
    - sprite: *id-rsi
      state: stripe_top
      color: "#0c7d1d" #Starlight
    - sprite: *id-rsi
      state: stripe_bottom
      color: "#0a5715" #Starlight
    - sprite: &ronstation-icon-rsi _Ronstation/Interface/Misc/job_icons.rsi
      offset: *icon-offset
      state: CCDivAdmin
  - type: Item
    sprite: Objects/Misc/id_cards.rsi
    heldPrefix: gold
  - type: PresetIdCard
    job: CentralCommandOperator
  - type: NanoChatCard # CD
    listNumber: false

