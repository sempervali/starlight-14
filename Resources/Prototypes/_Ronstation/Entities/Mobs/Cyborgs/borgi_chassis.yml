- type: entity
  parent: BaseStationBorgiChassis
  id: SmartRSCentCommBorgiChassis
  name: Official Borgi
  description: An unusually smart dog, hired to work under Central Command. Adorable!
  suffix: ADMEME, DO NOT MAP, Blame Semper. # This is not just for me. Its intentionally silly levels of flexible for lowpop assistance and events.
  components:
    - type: ActionGrant
      actions:
      - ActionBorgiPlayMidi
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellAntiqueProto
          blacklist:
            tags:
            - MechReactor
    - type: ContainerFill
      containers:
        borg_brain:
          - MMIFilled # Implications.
        borg_module:
          - BorgModuleAdvancedTool
          - CentcommLaserModule
          - CentcommModuleSpaceMovement # Why the difference in naming convention, upstream..?
          - BorgModuleBartending # Because its purpose should be generally... tame.
    - type: AccessReader
      access:
        - - CentralCommand
    - type: EmpImmune
    - type: Loadout
      prototypes: [CentcomSmartBorgiGear]
    - type: SiliconLawProvider
      laws: CCObeyinglawset
    - type: BorgChassis
      maxModules: 10 # Why so many? Because its a CC borgi. Best of the best :>
      moduleWhitelist: # Mix and match any modules to fit your purpose. Events or lowpop support.
        tags:
        - BorgModuleGeneric
        - BorgModuleJanitor
        - BorgModuleService
        - BorgModuleCargo
        - BorgModuleMining
        - BorgModuleMedical
        - BorgModuleSyndicate
        - BorgModuleSyndicateAssault
        - BorgModuleEngineering
        - BorgModuleCentcomm
