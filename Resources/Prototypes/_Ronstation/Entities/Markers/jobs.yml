- type: entity
  id: SpawnPointCCK9
  parent: SpawnPointJobBase
  name: CentComm K9 Unit
  suffix: Only Map CC # Ronstation: Solidifying the intent of CCOs; if ATS spawns do work, CC ones theoretically should too
  components:
    - type: SpawnPoint
      job_id: CentralCommandK9
    - type: Sprite
      sprite: _Starlight/Markers/jobs.rsi
      layers:
        - state: green
        - sprite: _Starlight/Mobs/Pets/k9.rsi
          state: k9-brown
        - state: jobicon

- type: entity
  id: SpawnPointCCintern
  parent: SpawnPointJobBase
  name: CentComm Intern
  suffix: Only Map CC # still a CC specific role.
  components:
    - type: SpawnPoint
      job_id: CentralCommandIntern
    - type: Sprite
      sprite: _Starlight/Markers/jobs.rsi
      layers:
        - state: green
        - state: nct
        - state: jobicon
