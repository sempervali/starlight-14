- type: entity
  parent: ReagentDispenserBasePowerCell # Starlight edit: power cell soda dispenser
  id: SodaDispenserEmpty
  name: soda dispenser
  description: A beverage dispenser with a selection of soda and several other common beverages. Has a single fill slot for containers.
  suffix: Empty
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: soda
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: SodaDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  # Starlight start: Power Cell Soda dispenser
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        #Starlight Start
        blacklist:
          tags:
          - MechReactor
        #Starlight End
  # Starlight end
  - type: ReagentDispenser #Start Ronstation: AL port
    generatableReagents:
      Coffee: 1
      Cola: 1
      Cream: 1
      DrGibb: 1
      EnergyDrink: 1
      GreenTea: 1
      Grenadine: 1
      Ice: 1
      IcedTea: 1
      JuiceLemon: 1
      JuiceLime: 1
      JuiceOrange: 1
      JuicePineapple: 1
      JuiceTomato: 1
      LemonLime: 1
      RootBeer: 1
      PwrGame: 1
      ShamblersJuice: 1
      SodaWater: 1
      SolDry: 1
      SpaceMountainWind: 1
      SpaceUp: 1
      Sugar: 1
      Tea: 1
      TonicWater: 1
      Water: 1 #End Ronstation: AL port
- type: entity
  parent: SodaDispenserEmpty
  id: SodaDispenser
