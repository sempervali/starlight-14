- type: entity
  id: BoozeDispenserEmpty
  name: booze dispenser
  suffix: Empty
  description: A booze dispenser with a single slot for a container to be filled.
  parent: ReagentDispenserBasePowerCell # Starlight edit: power cell booze dispenser
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: booze
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: BoozeDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  - type: StealTarget
    stealGroup: BoozeDispenser
  # Starlight start: Power Cell Booze dispenser
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        #Starlight Start
        blacklist:
          tags:
          - MechReactor
        #Starlight End
  # Starlight
  #Ronstation start: AL port
  - type: ReagentDispenser
    generatableReagents:
      Absinthe: 1
      Ale: 1
      Beer: 1
      CoconutRum: 1
      CoffeeLiqueur: 1
      Cognac: 1
      BlueCuracao: 1
      Gin: 1
      Mead: 1
      MelonLiquor: 1
      Rum: 1
      Sake: 1
      Tequila: 1
      Vermouth: 1
      Vodka: 1
      Whiskey: 1
      Wine: 1
  #Ronstation end: AL port

- type: entity
  id: BoozeDispenser
  suffix: Filled
  parent: BoozeDispenserEmpty
