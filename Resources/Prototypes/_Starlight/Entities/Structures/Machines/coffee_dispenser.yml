- type: entity
  parent: ReagentDispenserBasePowerCell # Starlight edit: power cell soda dispenser
  id: CoffeeDispenserEmpty
  name: coffee dispenser
  description: A beverage dispenser with a selection of coffee and tea. Has a single fill slot for containers.
  suffix: Empty
  components:
  - type: Rotatable
  - type: Sprite
    sprite: _Starlight/Structures/coffee_machine.rsi
    drawdepth: SmallObjects
    state: coffee_machine
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: CoffeeDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  # Starlight start: Power Cell Soda dispenser
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        #Starlight Start
        blacklist:
          tags:
          - MechReactor
        #Starlight End
  # Starlight end
  # Ronstation start: Forgot the coffee! AL didn't actually do this, shockingly...
  - type: ReagentDispenser
    generatableReagents:
      Coffee: 1
      CoffeeLiqueur: 1
      Cream: 1
      GreenTea: 1
      Ice: 1
      Sugar: 1
      Tea: 1
  # Ronstation end

- type: entity
  parent: CoffeeDispenserEmpty
  id: CoffeeDispenser
